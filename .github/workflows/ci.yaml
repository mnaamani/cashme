name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint

  build:
    name: ${{ matrix.host }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x64
          - os: ubuntu-24.04-arm
            host: linux-arm64
          - os: macos-latest
            host: darwin-arm64
          - os: macos-15-intel
            host: darwin-x64
          - os: windows-latest
            host: win32-x64
          - os: windows-11-arm
            host: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: Install w/ dev deps
        run: npm install

      - name: Build Local Runtime
        run: npm run make

      - name: Install Bare
        run: npm i -g bare-runtime

      - name: Test
        run: npm test

  packages:
    name: Workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: Install w/ dev deps
        run: npm install

      - name: Install Bare
        run: npm i -g bare-runtime

      - name: Test workspace packages
        run: npm run test:packages

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: Install w/ dev deps
        run: npm install

      - name: Install Bare
        run: npm i -g bare-runtime

      # The fake backend pays every invoice, keeping this independent from both a Lightning
      # node and testnut.cashu.space, whose rolling deployment has made CI intermittent.
      - name: Start test mint
        run: |
          docker run --detach --rm --name cashme-test-mint --publish 3338:3338 \
            --env MINT_BACKEND_BOLT11_SAT=FakeWallet \
            --env MINT_LISTEN_HOST=0.0.0.0 \
            --env MINT_LISTEN_PORT=3338 \
            --env MINT_PRIVATE_KEY=cashme-integration-test-key \
            cashubtc/nutshell:0.20.3 poetry run mint
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3338/v1/info && exit 0
            sleep 1
          done
          docker logs cashme-test-mint
          exit 1

      - name: Test
        run: CASHME_TEST_MINT=http://127.0.0.1:3338 npm run test:integration
